<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sproutGrad" x1="32" y1="20" x2="48" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="soilGrad" x1="10" y1="50" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="32" cy="32" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glowGrad)" />

  <!-- Shield / Circle Background with border -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="2" />

  <!-- Acoustic Sensing Sound Waves (Left & Right) -->
  <path d="M14 26 C12 29.5 12 34.5 14 38" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M50 26 C52 29.5 52 34.5 50 38" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M10 21 C7 27 7 37 10 43" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />
  <path d="M54 21 C57 27 57 37 54 43" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Soil / Furrow Base Bed -->
  <path d="M18 51 Q32 47 46 51" stroke="url(#soilGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Central Stem -->
  <path d="M32 48 C32 38 31 28 32 18" stroke="#ecfdf5" stroke-width="2.5" stroke-linecap="round" />

  <!-- Main Left Leaf (Curved Agricultural Leaf) -->
  <path d="M32 36 C24 36 17 28 20 18 C28 17 32 25 32 36 Z" fill="url(#leafGrad)" stroke="#ecfdf5" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Leaf Vein Left -->
  <path d="M22 23 C26 26 29 29 32 31" stroke="#a7f3d0" stroke-width="1" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Secondary Right Leaf (Sprout Leaf) -->
  <path d="M32 30 C38 30 46 25 45 15 C37 14 33 21 32 30 Z" fill="url(#sproutGrad)" stroke="#ecfdf5" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Leaf Vein Right -->
  <path d="M42 19 C39 22 36 25 32 26" stroke="#dcfce7" stroke-width="1" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- AI Pulse Beacon at Top of Sprout -->
  <circle cx="32" cy="16" r="2.5" fill="#facc15" stroke="#ffffff" stroke-width="0.8" />
</svg>
